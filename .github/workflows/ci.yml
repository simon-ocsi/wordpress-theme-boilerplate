name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: wp-content/themes/starter-theme/package-lock.json

      - name: Install front-end dependencies
        working-directory: wp-content/themes/starter-theme
        run: npm ci

      - name: Lint JavaScript
        working-directory: wp-content/themes/starter-theme
        run: npm run lint

      - name: Check formatting
        working-directory: wp-content/themes/starter-theme
        run: npm run format:check

      - name: Build production assets
        working-directory: wp-content/themes/starter-theme
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install PHP tooling
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: find wp-content/themes/starter-theme -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

      - name: WordPress coding standards
        run: composer phpcs
